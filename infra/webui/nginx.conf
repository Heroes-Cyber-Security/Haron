server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://manager:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Player RPC traffic. Both prefixes are forwarded via the forwarder,
    # which enforces the JSON-RPC method denylist before proxying to the
    # orchestrator. /anvil/ is the public prefix used by the manager's RPC
    # URLs; /eth/ is the webui's fallback RPC URL.
    #
    # The forwarder internally maps /eth/{id}[/{chain}] to
    # /anvil/{id}[/{chain}], so both HTTP and WebSocket requests are covered.
    location /anvil/ {
        rewrite ^/anvil/(.*)$ /eth/$1 break;
        proxy_pass http://forwarder:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /eth/ {
        proxy_pass http://forwarder:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
